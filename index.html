<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR 诊断版</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #hud { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10; padding: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; border-radius: 8px;}
  </style>

  <!-- 添加错误捕获，直接把报错显示在屏幕上 -->
  <script>
    window.onerror = function(msg, url, line) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed; top:0; left:0; right:0; background:red; color:white; z-index:9999; font-size:12px; padding:10px; word-break:break-all;';
      errDiv.innerHTML = '<b>报错啦：</b><br>' + msg + '<br>位置: ' + url + ':' + line;
      document.body.appendChild(errDiv);
    };
  </script>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- 使用国内相对稳定的 unpkg 源 -->
  <script src="https://unpkg.com/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <div id="hud">
    诊断模式：如果页面全黑，请留意屏幕最顶部是否有红色报错信息。
  </div>

  <a-scene 
    vr-mode-ui="enabled: false" 
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-marker preset="hiro">
      <a-box position="0 0.5 0" rotation="0 45 45" scale="0.5 0.5 0.5" color="#EF2D5E"></a-box>
    </a-marker>
    
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
