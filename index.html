<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hiro AR 小星球</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #hud { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10; padding: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; border-radius: 8px;}
  </style>

  <!-- 使用公认最稳定的版本组合 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <div id="hud">
    把摄像头对准 <b>Hiro 标记</b>，出现红色方块后点屏幕可换颜色。
  </div>

  <!-- 移除 embedded，确保全屏；vr-mode-ui 强制关闭 -->
  <a-scene 
    vr-mode-ui="enabled: false" 
    renderer="logarithmicDepthBuffer: true; precision: mediump;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  >
    <a-marker preset="hiro">
      <!-- 先放一个最基础的方块，测试能否识别 -->
      <a-box id="testBox" position="0 0.5 0" rotation="0 45 45" scale="0.5 0.5 0.5" color="#EF2D5E"></a-box>
    </a-marker>
    
    <!-- 必须有摄像头实体 -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // 添加换色小功能
    const box = document.getElementById('testBox');
    const colors = ['#EF2D5E', '#22c55e', '#f97316', '#a855f7', '#0ea5e9'];
    let colorIndex = 0;
    window.addEventListener('pointerdown', () => {
      colorIndex = (colorIndex + 1) % colors.length;
      box.setAttribute('color', colors[colorIndex]);
    });
  </script>
</body>
</html>
