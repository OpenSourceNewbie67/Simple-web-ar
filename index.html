<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR 扫码小星球 (原生流版)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui; }
    
    /* 1. 原生视频流作为全屏底层背景 */
    #ar-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; /* 铺满屏幕不变形 */
      z-index: 0;
    }

    /* 2. A-Frame 画布浮在视频上方，且背景透明 */
    a-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      background: transparent !important; 
    }

    /* 启动按钮层 */
    #start-screen {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #111; color: #fff; padding: 20px; text-align: center;
    }
    #start-btn {
      padding: 15px 40px; font-size: 18px; font-weight: bold;
      background: #0ea5e9; color: #fff; border: none; border-radius: 30px;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.5);
      margin-top: 20px;
    }
    
    /* 底部提示 */
    #hud {
      position: fixed; bottom: 10px; left: 10px; right: 10px; 
      color: #fff; background: rgba(0,0,0,0.6); padding: 10px; 
      border-radius: 8px; font-size: 14px; z-index: 10; text-align: center;
      pointer-events: none; /* 防止挡住点击换色事件 */
    }
  </style>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- 引入 AR.js -->
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body>
  
  <!-- 底层视频标签 -->
  <video id="ar-video" autoplay playsinline muted></video>

  <!-- 启动遮罩层 -->
  <div id="start-screen">
    <h2>AR 小星球</h2>
    <div style="color:#aaa; font-size:14px; margin-top:15px; line-height:1.5;">点击启动，对准 <b>0 号 AR 二维码</b></div>
    <button id="start-btn">启动摄像头</button>
  </div>

  <div id="hud">
    对准二维码，小星球会悬浮在上方，点屏幕可换色。
  </div>

  <!-- AR 场景：注意 arjs 的配置改成了 sourceType: video -->
  <a-scene 
    embedded
    vr-mode-ui="enabled: false" 
    renderer="logarithmicDepthBuffer: true; precision: mediump; alpha: true"
    arjs="sourceType: video; sourceUrl: #ar-video; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  >
    <a-marker type="barcode" value="0">
      
      <!-- 小星球组合体 -->
      <a-entity position="0 0.4 0" animation="property: position; to: 0 0.5 0; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine">
        <!-- 星球本体 -->
        <a-sphere id="planetSphere" radius="0.15" color="#0ea5e9" material="metalness: 0.4; roughness: 0.2; emissive: #0284c7; emissiveIntensity: 0.5"></a-sphere>

        <!-- 旋转光环 1 -->
        <a-torus color="#fbbf24" radius="0.22" radius-tubular="0.01" rotation="75 0 0" material="emissive: #f59e0b; emissiveIntensity: 0.6" animation="property: rotation; to: 75 360 0; dur: 4000; loop: true; easing: linear"></a-torus>

        <!-- 旋转光环 2 -->
        <a-torus color="#f472b6" radius="0.28" radius-tubular="0.008" rotation="105 30 0" material="transparent: true; opacity: 0.85; emissive: #ec4899; emissiveIntensity: 0.5" animation="property: rotation; to: 105 390 0; dur: 6000; loop: true; easing: linear"></a-torus>

        <!-- 绕行卫星 -->
        <a-entity animation="property: rotation; to: 0 360 0; dur: 3000; loop: true; easing: linear">
          <a-sphere radius="0.03" color="#fde68a" position="0.3 0 0"></a-sphere>
        </a-entity>
      </a-entity>
      
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // 1. 点击按钮启动原生摄像头（你最信任的逻辑）
    document.getElementById('start-btn').addEventListener('click', function() {
      const video = document.getElementById('ar-video');
      
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function(stream) {
          // 将视频流绑定到我们的底层 video 标签
          video.srcObject = stream;
          // 强制播放
          video.play();
          
          // 隐藏启动层
          document.getElementById('start-screen').style.display = 'none';
          
          // 通知 A-Frame 重新调整大小，触发 AR.js 读取视频帧
          setTimeout(() => {
            window.dispatchEvent(new Event('resize'));
          }, 500);
        })
        .catch(function(err) {
          console.error('无法获取摄像头权限:', err);
          alert('获取摄像头失败，请检查权限或更换浏览器。');
        });
    });

    // 2. 点击屏幕换色功能
    const sphere = document.getElementById('planetSphere');
    const colors = ['#0ea5e9', '#22c55e', '#f97316', '#a855f7', '#ef4444'];
    let colorIndex = 0;

    window.addEventListener('pointerdown', (event) => {
      if (event.target.tagName === 'BUTTON') return;
      
      colorIndex = (colorIndex + 1) % colors.length;
      sphere.setAttribute('color', colors[colorIndex]);
      sphere.setAttribute('material', 'emissive', colors[colorIndex]);
      
      sphere.setAttribute('scale', '1.2 1.2 1.2');
      setTimeout(() => { sphere.setAttribute('scale', '1 1 1'); }, 150);
    });
  </script>
</body>
</html>
