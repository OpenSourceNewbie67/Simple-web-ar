<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Camera Test</title></head>
<body>
  <h1>摄像头测试</h1>
  <video id="video" width="300" autoplay playsinline></video>
  <p id="status">正在请求摄像头权限...</p>
  <script>
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => {
      document.getElementById('video').srcObject = stream;
      document.getElementById('status').textContent = '摄像头已成功启动！';
    })
    .catch(err => {
      document.getElementById('status').textContent = '启动失败: ' + err.name + ' - ' + err.message;
    });
  </script>
</body>
</html>
